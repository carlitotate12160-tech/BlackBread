# PR Agent (CodiumAI) with DeepSeek.
#
# This workflow runs the open-source PR-Agent on pull requests and PR comments,
# using a DeepSeek API key supplied as the repository secret DEEPSEEK_API_KEY.
#
# For safety-critical PRs, the current-head PR-Agent (DeepSeek) review is binding
# and must be complete with all actionable findings disposed before merge.
# For non-safety-critical PRs, CodeRabbit is the primary advisory reviewer and
# PR-Agent may provide fallback. The workflow is not a required status check.
#
# Trigger policy: auto-review fires once per PR lifecycle (opened, reopened,
# ready_for_review) — NOT on every synchronize/push. This aligns with the
# "trigger once at the exact head" contract and avoids redundant DeepSeek token
# spend on intermediate commits. For safety-critical PRs, the binding
# current-head review is triggered manually via `/review` comment by the owner
# at the final head before merge. HANDLE_PUSH_TRIGGER is disabled to prevent
# the double-review that occurred when both the synchronize event and the
# push-trigger handler fired on the same commit.
#
# Security note: PR-Agent sends the PR diff to DeepSeek's API. The repository
# owner is responsible for the data-handling terms of that API key.
name: PR Agent DeepSeek

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
  issue_comment:
    types: [created]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: pr-agent-deepseek-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.sender.type != 'Bot' &&
      (
        (github.event_name == 'pull_request' &&
         github.event.pull_request.base.ref == 'main' &&
         !github.event.pull_request.draft &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'issue_comment' &&
         github.event.issue.pull_request &&
         (github.event.comment.author_association == 'OWNER' ||
          github.event.comment.author_association == 'MEMBER' ||
          github.event.comment.author_association == 'COLLABORATOR') &&
         startsWith(github.event.comment.body, '/'))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Verify DeepSeek API key is set
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        if: ${{ env.DEEPSEEK_API_KEY == '' }}
        run: |
          echo "::error::Secret DEEPSEEK_API_KEY is not set. Add it in repo settings -> secrets -> actions."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09

      - name: Select model based on safety-critical label
        id: select_model
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          # Per ADR-FINAL-002 Amendment A-001: V4-Pro for safety-critical, V4-Flash otherwise.
          # Default to V4-Flash (advisory) when label is absent — safe direction (under-spend).
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | join(",")' 2>/dev/null || echo "")
          if echo "$LABELS" | grep -qi "safety-critical"; then
            echo "model=deepseek/deepseek-v4-pro" >> "$GITHUB_OUTPUT"
            echo "fallback=deepseek/deepseek-v4-flash" >> "$GITHUB_OUTPUT"
            echo "Selected V4-Pro (binding, safety-critical label present)"
          else
            echo "model=deepseek/deepseek-v4-flash" >> "$GITHUB_OUTPUT"
            echo "fallback=deepseek/deepseek-v4-pro" >> "$GITHUB_OUTPUT"
            echo "Selected V4-Flash (advisory, no safety-critical label)"
          fi

      - name: Run PR Agent
        uses: The-PR-Agent/pr-agent@ab6ec54bfeb37933ddb74259338752e9272016c6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          CONFIG__MODEL: ${{ steps.select_model.outputs.model }}
          CONFIG__FALLBACK_MODELS: ${{ format('["{0}"]', steps.select_model.outputs.fallback) }}
          GITHUB_ACTION_CONFIG__AUTO_REVIEW: "true"
          GITHUB_ACTION_CONFIG__AUTO_DESCRIBE: "false"
          GITHUB_ACTION_CONFIG__AUTO_IMPROVE: "false"
          GITHUB_ACTION_CONFIG__HANDLE_PUSH_TRIGGER: "false"
