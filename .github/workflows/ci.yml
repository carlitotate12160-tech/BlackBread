name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GITLEAKS_LINUX_X64_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
  GITLEAKS_VERSION: 8.24.3
  UV_VERSION: 0.8.11

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-uv
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BLACKBREAD_TEST_DATABASE_URL: postgresql+asyncpg://blackbread_test:blackbread_test@127.0.0.1:5432/blackbread_test
    services:
      postgres:
        image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
        env:
          POSTGRES_DB: blackbread_test
          POSTGRES_PASSWORD: blackbread_test
          POSTGRES_USER: blackbread_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackbread_test -d blackbread_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-uv
      - run: uv run pytest
      - name: Safety-critical coverage (90% threshold)
        run: uv run python scripts/check_safety_coverage.py

  security:
    name: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-uv
      - run: uv run bandit -c pyproject.toml -r src/blackbread
      - run: uv run pip-audit
      - uses: ./.github/actions/install-gitleaks
      - run: ./gitleaks git --redact --no-banner --gitleaks-ignore-path .gitleaksignore

  governance:
    name: governance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: ./.github/actions/setup-uv
      - run: uv lock --check
      - run: uv run pytest tests/governance --no-cov
