name: Install verified Gitleaks
description: Download, verify SHA256, and extract gitleaks binary.

runs:
  using: composite
  steps:
    - name: Download and verify gitleaks
      shell: bash
      run: |
        curl -fsSLo gitleaks.tar.gz \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_LINUX_X64_SHA256}  gitleaks.tar.gz" | sha256sum -c -
        tar --no-same-owner -xzf gitleaks.tar.gz gitleaks
