[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blackbread"
version = "0.1.0"
description = "Authorized external red-team orchestration platform"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "cryptography>=50,<51",
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "bandit>=1.8,<2",
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "pytest-randomly>=3.16,<4",
  "pytest-timeout>=2.4,<3",
  "pyyaml>=6.0,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/blackbread"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --timeout=30 --cov=blackbread --cov-report=term-missing:skip-covered --cov-fail-under=80"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "S", "ASYNC", "C4", "RET", "SIM", "PL", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "S603", "S607"]
"migrations/**" = ["E501"]
"scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/blackbread"]

[tool.coverage.run]
branch = true
source = ["blackbread"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.coverage.safety_critical]
fail_under = 90
include = [
  "blackbread.policy.*",
  "blackbread.opsec.*",
  "blackbread.scope.*",
  "blackbread.identity.*",
  "blackbread.ledger.*",
  "blackbread.security.*",
  "blackbread.tenancy.*",
]

[tool.bandit]
exclude_dirs = ["tests"]
targets = ["src/blackbread"]
