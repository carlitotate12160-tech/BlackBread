name: blackbread

services:
  database:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: blackbread
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackbread}
      POSTGRES_USER: blackbread
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbread -d blackbread"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - control-plane
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      BLACKBREAD_ARTIFACT_KEY: ${BLACKBREAD_ARTIFACT_KEY:?set BLACKBREAD_ARTIFACT_KEY}
      BLACKBREAD_DATABASE_URL: postgresql+asyncpg://blackbread:${POSTGRES_PASSWORD:-blackbread}@database:5432/blackbread
    depends_on:
      database:
        condition: service_healthy
    networks:
      - control-plane
    restart: "no"

  api:
    build:
      context: .
    environment:
      BLACKBREAD_ARTIFACT_KEY: ${BLACKBREAD_ARTIFACT_KEY:?set BLACKBREAD_ARTIFACT_KEY}
      BLACKBREAD_ARTIFACT_ROOT: /var/lib/blackbread/artifacts
      BLACKBREAD_DATABASE_URL: postgresql+asyncpg://blackbread:${POSTGRES_PASSWORD:-blackbread}@database:5432/blackbread
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - control-plane
    ports:
      - "8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - artifacts:/var/lib/blackbread/artifacts

networks:
  control-plane:
    internal: true

volumes:
  artifacts:
  postgres-data:

