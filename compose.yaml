name: blackbread

services:
  database:
    image: postgres:17.11-bookworm@sha256:051f7b7b3abdd564d5d1bd1e8c4b9c1b6e77087d1dd22020ede611c096a272e0
    environment:
      BLACKBREAD_RUNTIME_DB_PASSWORD: ${BLACKBREAD_RUNTIME_DB_PASSWORD:-blackbread-runtime}
      POSTGRES_DB: blackbread
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:-blackbread-migration}
      POSTGRES_USER: blackbread_migration
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbread_migration -d blackbread"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - control-plane
    volumes:
      - ./deploy/postgres/init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
      - postgres-data:/var/lib/postgresql/data

  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      BLACKBREAD_ARTIFACT_KEY: ${BLACKBREAD_ARTIFACT_KEY:?set BLACKBREAD_ARTIFACT_KEY}
      BLACKBREAD_DATABASE_URL: postgresql+asyncpg://blackbread_migration:${POSTGRES_MIGRATION_PASSWORD:-blackbread-migration}@database:5432/blackbread
    depends_on:
      database:
        condition: service_healthy
    networks:
      - control-plane
    restart: "no"

  api:
    build:
      context: .
    environment:
      BLACKBREAD_ARTIFACT_KEY: ${BLACKBREAD_ARTIFACT_KEY:?set BLACKBREAD_ARTIFACT_KEY}
      BLACKBREAD_ARTIFACT_ROOT: /var/lib/blackbread/artifacts
      BLACKBREAD_DATABASE_URL: postgresql+asyncpg://blackbread_app:${BLACKBREAD_RUNTIME_DB_PASSWORD:-blackbread-runtime}@database:5432/blackbread
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - control-plane
    ports:
      - "8000:8000"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - artifacts:/var/lib/blackbread/artifacts

networks:
  control-plane:
    internal: true

volumes:
  artifacts:
  postgres-data:
